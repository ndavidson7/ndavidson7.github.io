name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref_name != 'main' && 'staging' || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-ci:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - run: echo "CI passed or workflow manually triggered, proceeding with deployment"
  build:
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v7
        with:
          name: assets
          path: dist/
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name != 'main' && 'staging' || 'production' }}
      url: ${{ github.ref_name != 'main' && 'https://portfolio-staging.nicholasdavidson7.workers.dev/' || 'https://www.nicholasdavidson.dev/' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Download artifact from build step
        uses: actions/download-artifact@v8
        with:
          name: assets
          path: dist/
      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ github.ref_name != 'main' && 'staging' || 'production' }}
